<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>NEGIN ✦ A Story Still Blooming</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --gold:#f5c17c;
    --gold-light:#ffe6b4;
    --rose:#ff9fbd;
    --rose-dark:#8e3655;
    --cream:#fff1df;
    --dark:#090507;

    --mx:50%;
    --my:50%;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    background:#050304;
}

body{
    font-family:"Montserrat",sans-serif;
    background:#050304;
    color:white;
    overflow-x:hidden;
    cursor:none;
    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    width:100%;
    min-height:100vh;
    min-height:100dvh;

    overflow:hidden;

    display:flex;
    align-items:center;

    background:
        radial-gradient(
            circle at 25% 40%,
            rgba(125,42,68,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 50%,
            rgba(94,28,56,.18),
            transparent 40%
        ),
        linear-gradient(
            120deg,
            #090405,
            #17090e 48%,
            #050304
        );
}


/* =========================================================
   BACKGROUND PHOTO
========================================================= */

.background-photo{
    position:absolute;
    inset:0;

    background-image:url("negin.jpg");
    background-size:cover;
    background-position:center 35%;

    opacity:.08;

    filter:
        blur(25px)
        saturate(.8);

    transform:scale(1.15);

    z-index:0;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.hero::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:1;

    background:

        radial-gradient(
            circle at var(--mx) var(--my),
            rgba(255,183,207,.09),
            transparent 20%
        ),

        linear-gradient(
            90deg,
            rgba(4,2,3,.10),
            rgba(4,2,3,.25) 45%,
            rgba(4,2,3,.72) 100%
        );
}


/* =========================================================
   STARS
========================================================= */

#stars{
    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 12px var(--rose);

    animation:
        starBlink
        var(--speed)
        ease-in-out
        infinite
        alternate;
}

@keyframes starBlink{
    from{
        opacity:.15;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.8);
    }
}


/* =========================================================
   MOON
========================================================= */

.moon{
    position:absolute;

    width:min(48vw,680px);
    aspect-ratio:1;

    left:-5vw;
    top:-12vw;

    border-radius:50%;

    z-index:2;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.9),
            transparent 3%
        ),

        radial-gradient(
            circle at 65% 55%,
            rgba(132,71,62,.16),
            transparent 8%
        ),

        radial-gradient(
            circle at 45% 45%,
            #ffe2c3,
            #d78d76 55%,
            #824954 80%,
            #2b1720
        );

    box-shadow:
        0 0 30px rgba(255,197,163,.6),
        0 0 100px rgba(255,123,167,.18),
        0 0 200px rgba(255,180,132,.10);

    opacity:.72;

    animation:
        moonFloat
        9s
        ease-in-out
        infinite
        alternate;
}

.moon::after{
    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 22% 45%,
            rgba(85,45,48,.20) 0 5%,
            transparent 6%
        ),

        radial-gradient(
            circle at 58% 22%,
            rgba(85,45,48,.18) 0 7%,
            transparent 8%
        ),

        radial-gradient(
            circle at 72% 66%,
            rgba(85,45,48,.16) 0 9%,
            transparent 10%
        );
}

@keyframes moonFloat{
    to{
        transform:
            translateY(20px)
            translateX(10px);
    }
}


/* =========================================================
   TOP TEXT
========================================================= */

.top-decoration{
    position:absolute;

    top:30px;
    left:5%;
    right:5%;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:25px;

    color:var(--gold-light);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:12px;

    letter-spacing:8px;

    text-transform:uppercase;

    opacity:.85;
}

.top-decoration .line{
    height:1px;
    flex:1;

    max-width:320px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}

.top-heart{
    font-size:26px;

    filter:
        drop-shadow(
            0 0 10px
            var(--gold)
        );

    animation:
        heartPulse
        2s
        ease-in-out
        infinite;
}

@keyframes heartPulse{
    50%{
        transform:scale(1.2);
    }
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.layout{
    position:relative;

    z-index:10;

    width:min(1500px,94%);

    min-height:100vh;
    min-height:100dvh;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr
        1.08fr;

    align-items:center;

    gap:3vw;

    padding:
        90px 0
        55px;
}


/* =========================================================
   PORTRAIT SIDE
========================================================= */

.portrait-area{
    position:relative;

    min-height:720px;

    display:flex;
    align-items:flex-end;
    justify-content:center;
}


/* =========================================================
   PORTRAIT FRAME
========================================================= */

.portrait-frame{
    position:relative;

    width:min(95%,630px);
    height:680px;

    overflow:hidden;

    border-radius:
        48% 48%
        12% 12% /
        18% 18%
        10% 10%;

    border:
        1px solid
        rgba(255,208,160,.34);

    box-shadow:

        0 0 0 8px
        rgba(255,255,255,.015),

        0 0 70px
        rgba(255,100,155,.18),

        0 50px 100px
        rgba(0,0,0,.7);

    animation:
        portraitReveal
        2s
        cubic-bezier(.16,1,.3,1)
        forwards;

    opacity:0;
}

@keyframes portraitReveal{

    from{
        opacity:0;

        transform:
            translateY(70px)
            scale(.92);

        filter:
            blur(20px);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:
            blur(0);
    }
}


/* =========================================================
   ACTUAL IMAGE
========================================================= */

.portrait-frame img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    object-position:
        center 22%;

    transform:scale(1.03);

    filter:
        saturate(.88)
        contrast(1.04)
        brightness(.92);

    transition:
        transform
        1.2s
        cubic-bezier(.16,1,.3,1),
        filter
        1s ease;
}

.portrait-frame:hover img{
    transform:
        scale(1.07);

    filter:
        saturate(1)
        contrast(1.05)
        brightness(.97);
}


/* =========================================================
   IMAGE COLOR BLENDING
========================================================= */

.portrait-frame::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:

        linear-gradient(
            to top,
            rgba(10,4,7,.82),
            transparent 34%
        ),

        linear-gradient(
            90deg,
            rgba(70,18,38,.20),
            transparent 40%,
            rgba(255,183,204,.08)
        );

    mix-blend-mode:multiply;
}

.portrait-frame::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    box-shadow:
        inset 0 0 100px
        rgba(10,2,7,.75);

    border-radius:inherit;
}


/* =========================================================
   PORTRAIT GLOW
========================================================= */

.portrait-glow{
    position:absolute;

    width:75%;
    height:75%;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(255,100,165,.14);

    filter:
        blur(80px);

    z-index:-1;
}


/* =========================================================
   FLOWER CLUSTERS
========================================================= */

.flower-cluster{
    position:absolute;

    z-index:15;

    pointer-events:none;
}

.cluster-left{
    left:-20px;
    bottom:0;

    transform:
        rotate(-10deg);
}

.cluster-right{
    right:-10px;
    bottom:25px;

    transform:
        scale(.8)
        rotate(15deg);
}

.flower{
    position:absolute;

    width:110px;
    height:110px;

    animation:
        flowerFloat
        5s
        ease-in-out
        infinite
        alternate;
}

.flower:nth-child(2){
    left:75px;
    top:-60px;

    transform:scale(.75);

    animation-delay:-2s;
}

.flower:nth-child(3){
    left:140px;
    top:10px;

    transform:scale(.55);

    animation-delay:-3s;
}

@keyframes flowerFloat{
    to{
        translate:0 -12px;
    }
}

.flower-petal{
    position:absolute;

    left:36px;
    top:10px;

    width:40px;
    height:68px;

    border-radius:
        90% 20%
        75% 25%;

    transform-origin:
        50% 48px;

    background:

        radial-gradient(
            circle at 40% 25%,
            rgba(255,255,255,.9),
            transparent 20%
        ),

        linear-gradient(
            150deg,
            #ffe1e9,
            #e66b9b 65%,
            #8b294f
        );

    box-shadow:
        inset 0 0 12px
        rgba(255,255,255,.35),

        0 0 16px
        rgba(255,100,160,.18);
}

.flower-petal:nth-child(1){
    transform:
        rotate(0deg)
        translateY(-15px);
}

.flower-petal:nth-child(2){
    transform:
        rotate(72deg)
        translateY(-15px);
}

.flower-petal:nth-child(3){
    transform:
        rotate(144deg)
        translateY(-15px);
}

.flower-petal:nth-child(4){
    transform:
        rotate(216deg)
        translateY(-15px);
}

.flower-petal:nth-child(5){
    transform:
        rotate(288deg)
        translateY(-15px);
}

.flower-center{
    position:absolute;

    width:24px;
    height:24px;

    left:44px;
    top:43px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff7cc,
            #e69b42 50%,
            #8b481a
        );

    box-shadow:
        0 0 18px
        rgba(255,199,105,.8);
}


/* =========================================================
   CONTENT SIDE
========================================================= */

.content-area{
    position:relative;

    min-height:650px;

    display:flex;
    justify-content:center;
    align-items:center;
}


/* =========================================================
   GLASS CARD
========================================================= */

.glass-card{
    position:relative;

    width:min(100%,720px);

    padding:
        70px 55px
        60px;

    text-align:center;

    border-radius:38px;

    border:
        1px solid
        rgba(255,194,179,.28);

    background:
        linear-gradient(
            145deg,
            rgba(60,20,35,.15),
            rgba(12,5,8,.26)
        );

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.13),

        0 40px 100px
        rgba(0,0,0,.4),

        0 0 80px
        rgba(255,96,155,.07);

    opacity:0;

    animation:
        cardReveal
        1.8s
        .6s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes cardReveal{

    from{
        opacity:0;

        transform:
            translateX(60px);

        filter:blur(15px);
    }

    to{
        opacity:1;

        transform:
            translateX(0);

        filter:blur(0);
    }
}


/* =========================================================
   GLASS BORDER LIGHT
========================================================= */

.glass-card::before{
    content:"";

    position:absolute;

    inset:-1px;

    border-radius:inherit;

    padding:1px;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(255,224,170,.7),
            transparent 30%,
            rgba(255,121,174,.6),
            transparent 65%,
            rgba(255,224,170,.6)
        );

    background-size:300% 100%;

    animation:
        borderFlow
        7s
        linear
        infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0)
        content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    pointer-events:none;
}

@keyframes borderFlow{
    to{
        background-position:
            -300% 0;
    }
}


/* =========================================================
   LABEL
========================================================= */

.small-title{
    font-family:
        "Cormorant Garamond",
        serif;

    color:
        rgba(255,226,200,.72);

    font-size:13px;

    letter-spacing:10px;

    text-transform:uppercase;

    margin-bottom:25px;
}


/* =========================================================
   NEGIN TITLE
========================================================= */

.name{
    position:relative;

    display:flex;

    justify-content:center;
    align-items:center;

    white-space:nowrap;

    margin-bottom:5px;

    perspective:800px;

    user-select:none;
}

.letter{
    display:inline-block;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(110px,11vw,190px);

    line-height:.78;

    font-weight:500;

    color:transparent;

    background:
        linear-gradient(
            115deg,
            #6e351b 0%,
            #e39b4e 9%,
            #fff0bc 17%,
            #d76b9d 28%,
            #ffd8e5 36%,
            #ffe3a0 46%,
            #8f421d 55%,
            #ffd48b 65%,
            #fff4c9 72%,
            #e981aa 83%,
            #ffe5a2 92%,
            #8a421f 100%
        );

    background-size:
        300% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    filter:
        drop-shadow(
            0 1px 0
            #fff2c4
        )

        drop-shadow(
            0 4px 1px
            #703a20
        )

        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.7)
        )

        drop-shadow(
            0 0 18px
            rgba(255,133,177,.28)
        );

    animation:
        goldFlow
        7s
        linear
        infinite;

    transition:
        transform .35s ease,
        filter .35s ease;
}

@keyframes goldFlow{
    to{
        background-position:
            -300% 0;
    }
}

.letter:hover{
    transform:
        translateY(-13px)
        scale(1.07);

    filter:
        drop-shadow(
            0 0 12px
            white
        )

        drop-shadow(
            0 0 30px
            var(--rose)
        );
}


/* =========================================================
   CROWN
========================================================= */

.crown{
    position:absolute;

    top:-38px;
    left:50%;

    transform:
        translateX(-50%);

    font-size:38px;

    color:var(--gold);

    text-shadow:
        0 0 12px
        var(--gold),
        0 0 25px
        var(--rose);

    animation:
        crownFloat
        3s
        ease-in-out
        infinite;
}

@keyframes crownFloat{
    50%{
        transform:
            translateX(-50%)
            translateY(-7px)
            rotate(3deg);
    }
}


/* =========================================================
   SCRIPT
========================================================= */

.script{
    font-family:
        "Great Vibes",
        cursive;

    font-size:
        clamp(32px,4vw,55px);

    font-weight:400;

    color:
        #ffe0c7;

    margin-top:18px;

    text-shadow:
        0 0 18px
        rgba(255,160,190,.25);
}


/* =========================================================
   DIVIDER
========================================================= */

.divider{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:15px;

    width:80%;

    margin:
        28px auto;

    color:var(--gold);
}

.divider::before,
.divider::after{
    content:"";

    height:1px;
    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}


/* =========================================================
   ATTRIBUTES
========================================================= */

.attributes{
    font-family:
        "Cormorant Garamond",
        serif;

    color:
        rgba(255,228,206,.74);

    font-size:12px;

    letter-spacing:6px;

    text-transform:uppercase;
}


/* =========================================================
   QUOTE
========================================================= */

.quote{
    max-width:500px;

    margin:
        30px auto 0;

    color:
        rgba(255,225,211,.65);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:15px;

    line-height:2;

    letter-spacing:4px;

    text-transform:uppercase;
}

.quote-heart{
    margin-top:18px;

    color:#ffafc4;

    font-size:20px;

    text-shadow:
        0 0 18px
        var(--rose);

    animation:
        heartPulse
        2s
        infinite;
}


/* =========================================================
   SIDE WORDS
========================================================= */

.side-words{
    position:absolute;

    right:18px;
    top:50%;

    transform:
        translateY(-50%);

    display:flex;
    flex-direction:column;

    gap:14px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:9px;

    letter-spacing:3px;

    color:
        rgba(255,225,206,.5);

    text-transform:uppercase;
}


/* =========================================================
   BUTTERFLY
========================================================= */

.butterfly{
    position:absolute;

    z-index:25;

    width:50px;
    height:40px;

    pointer-events:none;

    filter:
        drop-shadow(
            0 0 10px
            #ffc783
        );
}

.butterfly.one{
    top:17%;
    right:20%;

    animation:
        butterflyFly
        10s
        ease-in-out
        infinite;
}

.butterfly.two{
    left:8%;
    bottom:18%;

    transform:scale(.75);

    animation:
        butterflyFly2
        12s
        ease-in-out
        infinite;
}

.wing{
    position:absolute;

    width:27px;
    height:34px;

    top:0;

    border:
        1px solid
        #ffd695;

    background:
        linear-gradient(
            135deg,
            rgba(255,234,183,.75),
            rgba(255,128,179,.22)
        );

    box-shadow:
        inset 0 0 12px
        rgba(255,255,255,.5),
        0 0 15px
        rgba(255,172,106,.5);
}

.wing.left{
    left:0;

    border-radius:
        90% 15%
        75% 20%;

    transform-origin:right center;

    animation:
        wingLeft
        .5s
        ease-in-out
        infinite
        alternate;
}

.wing.right{
    right:0;

    border-radius:
        15% 90%
        20% 75%;

    transform-origin:left center;

    animation:
        wingRight
        .5s
        ease-in-out
        infinite
        alternate;
}

@keyframes wingLeft{
    to{
        transform:
            rotateY(65deg);
    }
}

@keyframes wingRight{
    to{
        transform:
            rotateY(-65deg);
    }
}

@keyframes butterflyFly{
    50%{
        transform:
            translate(
                -80px,
                40px
            )
            rotate(10deg);
    }
}

@keyframes butterflyFly2{
    50%{
        transform:
            translate(
                100px,
                -60px
            )
            scale(.75)
            rotate(-10deg);
    }
}


/* =========================================================
   FALLING PETALS
========================================================= */

.falling-petal{
    position:fixed;

    z-index:40;

    width:15px;
    height:24px;

    top:-40px;

    border-radius:
        80% 10%
        70% 20%;

    pointer-events:none;

    background:
        linear-gradient(
            140deg,
            #ffe2e8,
            #dc6595
        );

    box-shadow:
        0 0 10px
        rgba(255,122,172,.35);

    animation:
        petalFall
        linear
        forwards;
}

@keyframes petalFall{

    from{
        transform:
            translate3d(0,-50px,0)
            rotate(0deg);
    }

    50%{
        transform:
            translate3d(
                70px,
                50vh,
                0
            )
            rotate(360deg);
    }

    to{
        transform:
            translate3d(
                -50px,
                110vh,
                0
            )
            rotate(720deg);
    }
}


/* =========================================================
   CURSOR
========================================================= */

.cursor{
    position:fixed;

    width:8px;
    height:8px;

    border-radius:50%;

    background:white;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 8px white,
        0 0 20px var(--rose),
        0 0 35px var(--gold);
}

.cursor-ring{
    position:fixed;

    width:42px;
    height:42px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,210,180,.45);

    z-index:9998;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    transition:
        left .1s ease-out,
        top .1s ease-out,
        width .3s ease,
        height .3s ease;
}


/* =========================================================
   MAGIC PARTICLES
========================================================= */

.magic{
    position:fixed;

    z-index:999;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#ffe4a5;

    pointer-events:none;

    box-shadow:
        0 0 8px white,
        0 0 15px var(--rose);

    animation:
        magicBurst
        1s
        ease-out
        forwards;
}

@keyframes magicBurst{
    to{
        opacity:0;

        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.1);
    }
}


/* =========================================================
   SHOCKWAVE
========================================================= */

.shockwave{
    position:fixed;

    z-index:800;

    width:20px;
    height:20px;

    border:
        1px solid
        rgba(255,214,157,.8);

    border-radius:50%;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 25px
        rgba(255,133,178,.5);

    animation:
        shockwave
        1s
        ease-out
        forwards;
}

@keyframes shockwave{
    to{
        width:650px;
        height:650px;

        opacity:0;
    }
}


/* =========================================================
   BOTTOM BRAND
========================================================= */

.bottom-brand{
    position:absolute;

    z-index:25;

    bottom:18px;
    left:50%;

    transform:
        translateX(-50%);

    text-align:center;

    white-space:nowrap;
}

.bottom-brand strong{

    font-family:
        "Cormorant Garamond",

    color:var(--gold-light);

}

.bottom-brand span{

    letter-spacing:5px;

}

<script>

/* =========================================================
   DEVICE
========================================================= */

const touchDevice =
    "ontouchstart" in window ||
    navigator.maxTouchPoints > 0;


/* =========================================================
   ELEMENTS
========================================================= */

const hero =
    document.getElementById("hero");

const name =
    document.getElementById("name");

const card =
    document.getElementById("card");

const letters =
    document.querySelectorAll(".letter");

const cursor =
    document.getElementById("cursor");

const cursorRing =
    document.getElementById("cursorRing");

const stars =
    document.getElementById("stars");


/* =========================================================
   CREATE STARS
========================================================= */

const starAmount =
    touchDevice
        ? 55
        : 110;


for(
    let i = 0;
    i < starAmount;
    i++
){

    const star =
        document.createElement("span");

    star.className =
        "star";


    star.style.left =
        Math.random() *
        100 +
        "%";


    star.style.top =
        Math.random() *
        100 +
        "%";


    const size =
        Math.random() *
        2.5 +
        1;


    star.style.width =
        size +
        "px";


    star.style.height =
        size +
        "px";


    star.style.setProperty(
        "--speed",
        Math.random() *
        3 +
        1.5 +
        "s"
    );


    star.style.animationDelay =
        Math.random() *
        -5 +
        "s";


    stars.appendChild(
        star
    );

}


/* =========================================================
   MOUSE MOVEMENT
========================================================= */

if(!touchDevice){

    document.addEventListener(
        "mousemove",
        e => {

            const x =
                e.clientX;

            const y =
                e.clientY;


            cursor.style.left =
                x +
                "px";

            cursor.style.top =
                y +
                "px";


            cursorRing.style.left =
                x +
                "px";

            cursorRing.style.top =
                y +
                "px";


            const xp =
                x /
                window.innerWidth;

            const yp =
                y /
                window.innerHeight;


            document.documentElement
                .style.setProperty(
                    "--mx",
                    xp *
                    100 +
                    "%"
                );


            document.documentElement
                .style.setProperty(
                    "--my",
                    yp *
                    100 +
                    "%"
                );


            magneticLetters(
                x,
                y
            );

        }
    );

}


/* =========================================================
   MAGNETIC LETTERS
========================================================= */

function magneticLetters(
    mx,
    my
){

    letters.forEach(
        letter => {

            const rect =
                letter.getBoundingClientRect();


            const centerX =
                rect.left +
                rect.width /
                2;


            const centerY =
                rect.top +
                rect.height /
                2;


            const dx =
                mx -
                centerX;


            const dy =
                my -
                centerY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(
                distance <
                140
            ){

                const force =
                    (
                        140 -
                        distance
                    ) /
                    140;


                letter.style.transform =
                    `
                    translate(
                        ${dx * .05 * force}px,
                        ${dy * .05 * force}px
                    )

                    translateY(
                        ${-10 * force}px
                    )

                    scale(
                        ${1 + force * .05}
                    )
                    `;

            }

            else{

                letter.style.transform =
                    "";

            }

        }
    );

}


/* =========================================================
   PETALS
========================================================= */

function createPetal(){

    const petal =
        document.createElement(
            "div"
        );


    petal.className =
        "falling-petal";


    petal.style.left =
        Math.random() *
        100 +
        "vw";


    const size =
        Math.random() *
        10 +
        7;


    petal.style.width =
        size +
        "px";


    petal.style.height =
        size *
        1.55 +
        "px";


    const duration =
        Math.random() *
        6 +
        7;


    petal.style.animationDuration =
        duration +
        "s";


    petal.style.opacity =
        Math.random() *
        .5 +
        .25;


    document.body.appendChild(
        petal
    );


    setTimeout(
        () => petal.remove(),
        duration *
        1000
    );

}


setInterval(
    createPetal,
    touchDevice
        ? 900
        : 500
);


/* =========================================================
   EXPLOSION
========================================================= */

function explosion(
    x,
    y
){

    const amount =
        touchDevice
            ? 20
            : 35;


    for(
        let i = 0;
        i < amount;
        i++
    ){

        const dot =
            document.createElement(
                "div"
            );


        dot.className =
            "magic";


        dot.style.left =
            x +
            "px";


        dot.style.top =
            y +
            "px";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            Math.random() *
            150 +
            30;


        dot.style.setProperty(
            "--dx",
            Math.cos(angle) *
            distance +
            "px"
        );


        dot.style.setProperty(
            "--dy",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            dot
        );


        setTimeout(
            () =>
                dot.remove(),
            1000
        );

    }

}


/* =========================================================
   SHOCKWAVE
========================================================= */

function shockwave(
    x,
    y
){

    const wave =
        document.createElement(
            "div"
        );


    wave.className =
        "shockwave";


    wave.style.left =
        x +
        "px";


    wave.style.top =
        y +
        "px";


    document.body.appendChild(
        wave
    );


    setTimeout(
        () =>
            wave.remove(),
        1000
    );

}


/* =========================================================
   CLICK
========================================================= */

document.addEventListener(
    "click",
    e => {

        explosion(
            e.clientX,
            e.clientY
        );


        shockwave(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================================================
   LETTER CLICK
========================================================= */

letters.forEach(
    letter => {

        letter.addEventListener(
            "click",
            e => {

                e.stopPropagation();


                explosion(
                    e.clientX,
                    e.clientY
                );


                letter.animate(

                    [
                        {
                            transform:
                                "scale(1)"
                        },

                        {
                            transform:
                                "translateY(-20px) scale(1.2)"
                        },

                        {
                            transform:
                                "scale(.95)"
                        },

                        {
                            transform:
                                "scale(1)"
                        }
                    ],

                    {
                        duration:650,

                        easing:
                            "cubic-bezier(.16,1,.3,1)"
                    }

                );

            }
        );

    }
);


/* =========================================================
   MOBILE TOUCH LIGHT
========================================================= */

document.addEventListener(
    "touchmove",
    e => {

        if(
            !e.touches.length
        ){
            return;
        }


        const touch =
            e.touches[0];


        const xp =
            touch.clientX /
            window.innerWidth;


        const yp =
            touch.clientY /
            window.innerHeight;


        document.documentElement
            .style.setProperty(
                "--mx",
                xp *
                100 +
                "%"
            );


        document.documentElement
            .style.setProperty(
                "--my",
                yp *
                100 +
                "%"
            );


        magneticLetters(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   MOBILE TOUCH MAGIC
========================================================= */

document.addEventListener(
    "touchstart",
    e => {

        if(
            !e.touches.length
        ){
            return;
        }


        const touch =
            e.touches[0];


        explosion(
            touch.clientX,
            touch.clientY
        );


        shockwave(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   RESET TOUCH LETTERS
========================================================= */

document.addEventListener(
    "touchend",
    () => {

        setTimeout(
            () => {

                letters.forEach(
                    letter => {

                        letter.style.transform =
                            "";

                    }
                );

            },
            350
        );

    },
    {
        passive:true
    }
);

</script>
